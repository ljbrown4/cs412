{% extends 'mini_insta/base.html' %}

{% block content %}

<main class="container auth-page">
    <div class="auth-card">
        <div class="auth-heading">
            <h2>Log in</h2>
        </div>

        <form
            class="form"
            action="{% url 'login_mini' %}"
            method="POST"
        >
            {% csrf_token %}

            <table>
                {{form.as_table}}
            </table>

            {% if next %}
                <input type="hidden" name="next" value="{{next}}">
            {% else %}
                <input
                    type="hidden"
                    name="next"
                    value="{% url 'my_profile' %}"
                >
            {% endif %}

            <button class="submit-btn" type="submit">
                Log in
            </button>
        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{% url 'create_profile_mini' %}">
                Create one
            </a>
        </p>
    </div>
</main>

{% endblock %}

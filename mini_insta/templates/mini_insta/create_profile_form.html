{% extends 'mini_insta/base.html' %}

{% block content %}

<main class="container auth-page">
    <div class="auth-card auth-card-wide">
        <div class="auth-heading">
            <h2>Create your account</h2>
            <p>Set up your login details and profile below.</p>
        </div>

        <form
            class="form"
            action="{% url 'create_profile_mini' %}"
            method="POST"
        >
            {% csrf_token %}

            <div class="double3">
                <section class="auth-section">
                    <h3>Account details</h3>
                    <table>{{user.as_table}}</table>
                </section>

                <section class="auth-section">
                    <h3>Your profile</h3>
                    <table>{{form.as_table}}</table>
                    
                </section>
            </div>

            <div class="auth-actions">
                <a id="cancel" href="{% url 'show_all_profiles' %}">
                    Cancel
                </a>

                <button class="submit-btn" type="submit" name="submit">
                    Create account
                </button>
            </div>
        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{% url 'login_mini' %}">Log in</a>
        </p>
    </div>
</main>

{% endblock %}

<!-- # File: update_post_modal.html
# Description: post update form displayed inside a modal -->

<div class="modal-heading">
    <h2 id="post-modal-title">Update post</h2>

    <button
        class="modal-close"
        type="button"
        data-close-post-modal
        aria-label="Close update post"
    >
        &times;
    </button>
</div>

<form
    class="form"
    action="{% url 'update_post' post.pk %}"
    method="POST"
    hx-post="{% url 'update_post' post.pk %}"
    hx-target="#post-modal-content"
    hx-swap="innerHTML"
    hx-disabled-elt="find button[type='submit']"
>
    {% csrf_token %}

    {{form.non_field_errors}}

    <table>
        {{form.as_table}}
    </table>

    <div class="modal-actions">
        <button
            id="cancel"
            type="button"
            data-close-post-modal
        >
            Cancel
        </button>

        <button class="submit-btn" type="submit">
            Save changes
        </button>
    </div>
</form>

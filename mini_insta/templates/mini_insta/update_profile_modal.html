# Description: profile update form displayed inside a modal -->

<div class="modal-heading">
    <h2 id="profile-modal-title">Update profile</h2>

    <button
        class="modal-close"
        type="button"
        data-close-profile-modal
        aria-label="Close update profile"
    >
        &times;
    </button>
</div>

<form
    class="form"
    action="{% url 'update_profile_mini' %}"
    method="POST"
    hx-post="{% url 'update_profile_mini' %}"
    hx-target="#profile-modal-content"
    hx-swap="innerHTML"
    hx-disabled-elt="find button[type='submit']"
>
    {% csrf_token %}

    {{form.non_field_errors}}

    <table>
        {{form.as_table}}
    </table>

    <div class="modal-actions">
        <button
            id="cancel"
            type="button"
            data-close-profile-modal
        >
            Cancel
        </button>

        <button class="submit-btn" type="submit">
            Save changes
        </button>
    </div>
</form>
